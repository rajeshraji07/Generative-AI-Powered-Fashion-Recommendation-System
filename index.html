<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate AI Fashion Commerce 2026</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}
body{background:#0f172a;color:white;transition:0.3s}
header{background:#1e293b;padding:15px;text-align:center;color:#38bdf8;font-size:22px}
.container{padding:20px}
input,select,button{padding:8px;border-radius:6px;border:none;margin:5px}
button{background:#38bdf8;cursor:pointer;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;margin-top:20px}
.card{background:#1e293b;padding:15px;border-radius:12px;transition:0.3s}
.card:hover{transform:scale(1.05)}
.card img{width:100%;border-radius:8px}
.price{color:#4ade80;font-weight:bold}
.rating{color:#facc15}
.ai{font-size:13px;color:#38bdf8;margin-top:5px}
.cart{position:fixed;right:10px;top:70px;background:#111827;padding:15px;border-radius:10px;width:260px}
video{position:fixed;bottom:10px;left:10px;width:180px;border-radius:10px}
.toggle{position:absolute;right:20px;top:15px;cursor:pointer}
</style>
</head>

<body>

<header>
Ultimate AI Fashion Commerce 2026
<span class="toggle" onclick="toggleTheme()">🌗</span>
</header>

<div class="container">

<input type="text" id="searchInput" placeholder="Search fashion items...">
<button onclick="voiceSearch()">🎤</button>
<select id="category">
<option>All</option>
<option>Dress</option>
<option>Sneakers</option>
<option>Blazer</option>
<option>Streetwear</option>
</select>
<button onclick="searchProducts()">Search</button>
<button onclick="generateOutfit()">AI Outfit</button>
<button onclick="generateAIImage()">AI Image</button>

<div id="aiImage"></div>
<div class="grid" id="productGrid"></div>

</div>

<div class="cart">
<h3>🛒 Cart</h3>
<div id="cartItems"></div>
<button onclick="checkout()">Pay Now</button>
</div>

<script>

// ===============================
// USER PROFILE AI SYSTEM
// ===============================

if(!localStorage.getItem("userAI")){
    localStorage.setItem("userAI",JSON.stringify({
        preference:"Luxury",
        budget:5000
    }));
}

let user=JSON.parse(localStorage.getItem("userAI"));

// ===============================
// SIMULATED FLIPKART API DATA
// ===============================

const products=[
{name:"Luxury Silk Dress",category:"Dress",price:4999,rating:4.8,img:"https://source.unsplash.com/300x300/?dress"},
{name:"Urban Sneakers",category:"Sneakers",price:2999,rating:4.5,img:"https://source.unsplash.com/300x300/?sneakers"},
{name:"Corporate Blazer",category:"Blazer",price:3999,rating:4.7,img:"https://source.unsplash.com/300x300/?blazer"},
{name:"Street Hoodie",category:"Streetwear",price:1999,rating:4.4,img:"https://source.unsplash.com/300x300/?hoodie"}
];

// ===============================
// ML RECOMMENDATION ENGINE
// ===============================

function matchScore(product){
    let score=100 - Math.abs(product.price-user.budget)/100;
    return Math.floor(score);
}

// ===============================
// SEARCH PRODUCTS
// ===============================

function searchProducts(){
    let keyword=document.getElementById("searchInput").value.toLowerCase();
    let cat=document.getElementById("category").value;

    let filtered=products.filter(p=>
        (p.name.toLowerCase().includes(keyword)) &&
        (cat==="All"||p.category===cat)
    );

    displayProducts(filtered);
}

function displayProducts(list){
    let grid=document.getElementById("productGrid");
    grid.innerHTML="";
    if(list.length===0){grid.innerHTML="No products found";return;}

    list.forEach(p=>{
        grid.innerHTML+=`
        <div class="card">
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <div class="price">₹${p.price}</div>
        <div class="rating">⭐ ${p.rating}</div>
        <div class="ai">AI Match Score: ${matchScore(p)}%</div>
        <button onclick="addToCart('${p.name}',${p.price})">Add</button>
        <button onclick="generateDescription('${p.name}')">AI Desc</button>
        </div>
        `;
    });
}

// ===============================
// GPT DESCRIPTION (Demo Mode)
// ===============================

function generateDescription(name){
    alert("🤖 AI Description for "+name+
    "\nPremium quality fashion piece crafted for 2026 trends. Perfect for modern styling and confidence.");
}

// ===============================
// AI IMAGE GENERATION (Demo)
// ===============================

function generateAIImage(){
    document.getElementById("aiImage").innerHTML=
    `<img src="https://source.unsplash.com/300x300/?futuristic,fashion" width="200">`;
}

// ===============================
// SMART AI OUTFIT GENERATOR
// ===============================

function generateOutfit(){
    let colors=["Emerald","Charcoal","Beige","Lavender"];
    let outfits=["Blazer + Trousers","Street Hoodie + Sneakers","Luxury Dress + Heels"];
    alert("✨ AI Outfit Suggestion:\n"+
    colors[Math.floor(Math.random()*colors.length)]+" "+
    outfits[Math.floor(Math.random()*outfits.length)]);
}

// ===============================
// CART + PAYMENT
// ===============================

let cart=[];

function addToCart(name,price){
    cart.push({name,price});
    updateCart();
}

function updateCart(){
    let total=0;
    let html="";
    cart.forEach(item=>{
        total+=item.price;
        html+=item.name+" ₹"+item.price+"<br>";
    });
    html+="<hr>Total: ₹"+total;
    document.getElementById("cartItems").innerHTML=html;
}


function checkout(){
    alert("💳 Payment Successful (Simulation)");
    cart=[];
    updateCart();
}

// ===============================
// VOICE SEARCH
// ===============================

function voiceSearch(){
    const recognition=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
    recognition.start();
    recognition.onresult=e=>{
        document.getElementById("searchInput").value=e.results[0][0].transcript;
    }
}

// ===============================
// VIRTUAL TRY-ON CAMERA
// ===============================

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
    let video=document.createElement("video");
    video.srcObject=stream;
    video.autoplay=true;
    document.body.appendChild(video);
});

// ===============================
// DARK / LIGHT MODE
// ===============================

function toggleTheme(){
    if(document.body.style.background==="white"){
        document.body.style.background="#0f172a";
        document.body.style.color="white";
    }else{
        document.body.style.background="white";
        document.body.style.color="black";
        
    }
}

// Initial load
searchProducts();

</script>
</body>
</html>
